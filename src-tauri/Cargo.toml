[package]
name = "chakseok"
version = "1.0.0"
description = "착석 — 고사실 자리배치·시험시간표 자동 생성"
authors = ["Chakseok"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chakseok_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
